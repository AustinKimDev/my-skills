<style>

.top{grid-column:1/-1;padding:8px 16px;border-bottom:1px solid var(--line);background:#fff}.masthead{display:flex;align-items:center;gap:12px}.wordmark{font-weight:750}.session{margin:0;font-size:12px;flex:1}.connection{font-size:12px}#hide{font-size:12px;min-height:28px}h1{font-size:18px;letter-spacing:-.5px;margin:0;line-height:1.4}#question{margin:6px 0 12px;font-size:13px}.modes{display:flex;gap:4px;flex-wrap:wrap}.modes button{border-color:transparent}.modes button[aria-pressed=true]{background:var(--accent-soft);font-weight:650}

 solid var(--line);border-radius:6px;padding:2px}.preview-controls .choices button{font-size:12px;min-height:28px;padding:4px 8px}.preview-controls .field>span{display:none}.selection-status{font-size:12px;margin:0 2px 8px}.option-saved{display:block;font-size:12px;font-weight:700;color:var(--accent)}.selection-status:empty{display:none}
@media(max-width:760px){.preview-toolbar{align-items:flex-start}.preview-controls{gap:8px;width:100%}.preview-controls .field{max-width:100%}.sidebar-intro{padding:16px}.toolbar{padding:16px}.settings{grid-template-columns:1fr}.sidebar-intro #question{margin-bottom:8px}.design-option{scroll-margin-block:16px}.board.compare .variant{flex-basis:94%}}

h:640px}.empty-comparison h2{font-size:18px}.feedback-context{font-size:12px;padding:6px 0}.feedback-context button{font-size:11px;min-height:26px;margin-left:6px}.matrix-scroll:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@media(max-width:760px){.matrix-scroll{max-height:70vh}.matrix th,.matrix td{min-width:210px}.matrix th:first-child{min-width:135px;max-width:135px}.recommendations{grid-template-columns:1fr}}body.clean .panel-switch{display:none}

</head>
<body>
<header class="top" id="header">
 <div class="masthead"><span class="wordmark">UI Design</span><p class="session" id="session">시안 불러오는 중</p><span class="connection" id="connection" role="status">연결 확인 중</span><button id="hide" aria-label="검토 도구 접기">도구 접기</button></div>
</header>
<aside class="sidebar" id="sidebar" aria-label="시안 설정과 설명">
<div class="sidebar-intro">
 <h1 id="heading">함께 보고, 선택하고, 다듬기</h1><p id="question"></p>
 <details class="mode-menu" id="mode-menu"><summary id="mode-current">검토 모드</summary><nav class="modes" id="modes" aria-label="비교 모드"></nav></details>
</div>
<section class="toolbar" id="toolbar" aria-label="미리보기 설정">
 <div class="targets">
  <div class="field" id="subject-field"><span id="subject-label">비교 대상</span><div id="subject" class="choices" role="group" aria-labelledby="subject-label"></div></div>
  <div class="field" id="link-field"><span id="link-label">시안 고르는 방식</span><div id="link" class="choices" role="group" aria-labelledby="link-label"></div></div>
  <div class="field"><span id="variant-label">시안 고르기</span><p class="field-hint">선택하면 미리보기에 반영돼요.</p><div id="variant" class="choices" role="radiogroup" aria-labelledby="variant-label"></div></div>
 </div>
 <details class="settings-panel" id="settings-panel"><summary>상태·크기·사용 맥락</summary><div class="settings">
  <div class="field" id="state-field"><span id="state-label">상태</span><div id="state" class="choices" role="group" aria-labelledby="state-label"></div></div>
  <div class="field" id="size-field"><span id="size-label">크기</span><div id="size" class="choices" role="group" aria-labelledby="size-label"></div></div>
  <div class="field" id="context-field"><span id="context-label">맥락</span><div id="context" class="choices" role="group" aria-labelledby="context-label"></div></div>
 </div></details>
</section>
<footer class="bottom" id="bottom">
 <details class="feedback-panel" id="feedback-panel"><summary>수정 의견 남기기</summary><form class="feedback" id="feedback"><label for="message">어떤 점을 더 다듬을까요?</label><div id="feedback-context" class="feedback-context" hidden></div><textarea id="message" maxlength="4000" placeholder="예: A안의 목록을 유지하고, B안처럼 주요 행동을 위로 올려주세요."></textarea><div class="feedback-actions"><span id="feedback-status" role="status">의견은 선택한 시안과 함께 저장돼요.</span><button class="primary" id="send" type="submit">수정 의견 남기기</button></div></form></details>
 <details class="history-panel"><summary>선택과 의견 기록</summary><section class="history" aria-label="선택과 의견 기록"><div id="history"></div></section></details>
</footer>
</aside>
<main class="workspace" id="workspace">
 <p id="notice" role="alert"></p>
 <div class="preview-toolbar"><div class="workspace-info"><span id="scope"></span><div class="next" id="next"></div></div><div class="preview-controls">  <div class="field"><span id="view-label">보기</span><div id="view" class="choices" role="group" aria-labelledby="view-label"></div></div>  <div class="field"><span id="viewport-label">화면폭</span><div id="viewport" class="choices" role="group" aria-labelledby="viewport-label"></div></div></div></div>
 <div class="panel-switch" role="group" aria-label="작업 공간"><button id="panel-preview" type="button" aria-pressed="true">미리보기</button><button id="panel-comparison" type="button" aria-pressed="false">비교표·추천</button></div>
 <section id="comparison" aria-label="기준별 비교와 추천" hidden></section>
 <p id="selection-status" role="status" class="selection-status"></p>
 <div class="board" id="board" aria-label="디자인 시안"></div>
 <details id="catalog-details"><summary>화면 구성 아이디어 살펴보기</summary><div id="catalog-list"></div></details>
</main>

<button id="restore" hidden>검토 도구 열기</button>
<script>
const $=id=>document.getElementById(id);
const modeNames={page:'페이지',layout:'레이아웃',wireframe:'와이어프레임',prototype:'프로토타입',typography:'타이포그래피',component:'컴포넌트',color:'색상·테마',assets:'아이콘·에셋',motion:'인터랙션·모션',states:'상태·피드백'};
const stateNames={default:'기본',loading:'불러오는 중',empty:'비어 있음',error:'오류',disabled:'사용 불가',selected:'선택됨',sending:'전송 중',failed:'전송 실패',streaming:'응답 중',success:'완료',offline:'연결 끊김',invalid:'입력 오류',saving:'저장 중',hover:'마우스 올림',focus:'키보드 초점'};
let manifest,catalog=[],current={},saved={},historyStack=[],statusTimer,storageKey,frames=[],refreshing=false,queuedRefresh=false;
const node=(tag,cls,value)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(value!==undefined)e.textContent=value;return e;};
const subject=()=>manifest.subjects.find(s=>s.id===current.subject)||manifest.subjects[0];
const modeLabel=s=>s.modeLabel||modeNames[s.mode]||s.mode;
let feedbackCriterion=null;
const selected=()=>subject().variants.find(v=>v.id===current.variant)||subject().variants[0];
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(current));}catch{}const u=new URL(location.href);u.searchParams.set('subject',current.subject);u.searchParams.set('variant',current.variant);history.replaceState(null,'',u);}
function normalize(){const s=subject();current.subject=s.id;if(!current.variantChoices||typeof current.variantChoices!=='object'||Array.isArray(current.variantChoices))current.variantChoices={};if(!['separate','linked'].includes(current.link))current.link=manifest.variantLink==='linked'?'linked':'separate';const pick=current.variantChoices[s.id];current.variant=s.variants.some(v=>v.id===pick)?pick:s.variants[0].id;current.variantChoices[s.id]=current.variant;current.state=s.states.includes(current.state)?current.state:s.states[0];current.size=s.sizes.includes(current.size)?current.size:s.sizes[0];if(!current.viewportChoices||typeof current.viewportChoices!=='object'||Array.isArray(current.viewportChoices))current.viewportChoices={};current.viewport=['mobile','tablet','desktop'].includes(current.viewportChoices[s.id])?current.viewportChoices[s.id]:s.preview?.viewport||'desktop';current.view=current.view==='compare'?'compare':'single';current.context=current.context==='context'?'context':'isolated';current.panel=current.panel==='comparison'?'comparison':'preview';persist();}
function setSubject(id,push=true){feedbackCriterion=null;if(push&&id!==current.subject)historyStack.push(current.subject);current.subject=id;normalize();render();}
// Each subject keeps its own variant; linked mode applies the same variant ID to every subject that has it.
function setVariant(id){current.variant=id;current.variantChoices[current.subject]=id;if(current.link==='linked')for(const x of manifest.subjects)if(x.variants.some(v=>v.id===id))current.variantChoices[x.id]=id;}
function choose(key,value,focus=false){if(key==='subject')setSubject(value);else{if(key==='variant')setVariant(value);else current[key]=value;if(key==='link'&&value==='linked')setVariant(current.variant);if(key==='viewport')current.viewportChoices[current.subject]=value;render();}if(focus)[...$(key).children].find(b=>b.dataset.value===value)?.focus();}
function choices(key,values,label=x=>x){const group=$(key);group.replaceChildren(...values.map(value=>{const b=node('button','',key==='variant'?undefined:label(value));b.type='button';b.dataset.value=value;const active=current[key]===value;if(key==='variant'){const v=subject().variants.find(v=>v.id===value);b.className='design-option';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(active));b.setAttribute('aria-label',v.name);b.setAttribute('aria-describedby','option-description-'+v.id);b.tabIndex=active?0:-1;const copy=node('span','option-copy');const description=node('span','option-description',v.description);description.id='option-description-'+v.id;copy.append(node('strong','option-name',v.name),description);if(saved[current.subject]===value)copy.append(node('span','option-saved','선택 저장됨'));if(active){copy.append(node('span','option-tradeoff','고려할 점: '+v.tradeoff));if(v.reference)copy.append(node('span','option-reference','참고: '+v.reference));}b.append(copy);}else b.setAttribute('aria-pressed',String(active));b.onclick=()=>choose(key,value,true);return b;}));group.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key))return;const i=values.indexOf(current[key]),next=e.key==='Home'?0:e.key==='End'?values.length-1:(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)+values.length)%values.length;choose(key,values[next],true);e.preventDefault();e.stopPropagation();};}
function frameURL(v){let target=current.context==='context'&&v.contextUrl?v.contextUrl:v.url;const u=new URL(/^http:\/\//.test(target)?target:'/preview/'+target,location.origin);u.searchParams.set('state',current.state);u.searchParams.set('size',current.size);return u;}
function render(){
 normalize();const s=subject();$('session').textContent=manifest.title;document.title=manifest.title+' · UI Design';$('heading').textContent=s.name;$('question').textContent=s.question;
 $('modes').replaceChildren(...[...new Set(manifest.subjects.map(x=>x.mode))].map(m=>{const b=node('button','',modeLabel(manifest.subjects.find(x=>x.mode===m)));b.setAttribute('aria-pressed',String(s.mode===m));b.onclick=()=>{setSubject(manifest.subjects.find(x=>x.mode===m).id);$('mode-menu').open=false;$('mode-current').focus();};return b;}));
 const peers=manifest.subjects.filter(x=>x.mode===s.mode);choices('subject',peers.map(x=>x.id),id=>peers.find(x=>x.id===id).name);$('subject-field').hidden=peers.length<2;
 choices('link',['separate','linked'],x=>x==='separate'?'대상별로 따로':'모든 대상 같이');$('link-field').hidden=!linkable();
 choices('variant',s.variants.map(v=>v.id),id=>s.variants.find(v=>v.id===id).name);
 $('mode-current').textContent=modeLabel(s)+' · 검토 모드';$('mode-menu').hidden=new Set(manifest.subjects.map(x=>x.mode)).size<2;
 choices('viewport',['mobile','tablet','desktop'],x=>({mobile:'모바일 390',tablet:'태블릿 768',desktop:'데스크톱 1280'}[x]));
 choices('state',s.states,x=>s.stateLabels?.[x]||stateNames[x]||x);choices('size',s.sizes,x=>({sm:'작게',md:'보통',lg:'크게',default:'기본'}[x]||x));choices('context',['isolated','context'],x=>x==='isolated'?'단독 보기':'사용 맥락');
 $('state-field').hidden=s.states.length<2;$('size-field').hidden=s.sizes.length<2;$('context-field').hidden=!s.variants.some(v=>v.contextUrl);$('settings-panel').hidden=['state-field','size-field','context-field'].every(id=>$(id).hidden);
 choices('view',['single','compare'],x=>x==='single'?'하나씩':'나란히');
 const type=catalog.find(t=>t.id===s.type);$('scope').textContent=(s.purpose||type?.name||s.type||s.name)+' · '+modeLabel(s)+' · '+(current.view==='compare'?'동일 조건으로 비교':'선택한 안 자세히 보기');
 $('next').replaceChildren();if(historyStack.length){const back=node('button','','이전 화면');back.onclick=()=>setSubject(historyStack.pop(),false);$('next').append(back);}
 for(const id of s.next||[]){const target=manifest.subjects.find(x=>x.id===id);const b=node('button','','다음: '+target.name);b.onclick=()=>setSubject(id);$('next').append(b);}
 frames=[];$('board').className='board '+current.view+' '+s.mode;$('board').replaceChildren();
 for(const v of current.view==='compare'?s.variants:[selected()]){
  const card=node('article','variant'+(v.id===current.variant?' current':'')),head=node('div','variant-head'),choose=node('button',v.id===current.variant?'primary':'',saved[s.id]===v.id?'선택 저장됨':current.link==='linked'&&linkable()?'이 방향 선택 (모든 대상)':'이 방향 선택');
  head.append(node('h2','',v.name),choose);choose.onclick=async()=>{setVariant(v.id);persist();try{const targets=current.link==='linked'?manifest.subjects.filter(x=>x.variants.some(y=>y.id===v.id)):[s];for(const x of targets)await post('select','',x);render();}catch(e){notice(e.message);}};
  const canvas=node('div','canvas'),wrap=node('div','frame-wrap'),frame=document.createElement('iframe');frame.title=s.name+' — '+v.name;
  const u=frameURL(v);frame.setAttribute('sandbox',u.origin===location.origin?'allow-scripts':'allow-scripts allow-same-origin');frame.src=u.href;frame.loading='eager';frame.setAttribute('referrerpolicy','no-referrer');wrap.append(frame);canvas.append(wrap);
  if(current.viewport==='mobile'){card.style.flex='0 0 min(412px, 100%)';card.style.maxWidth='100%';}
  card.append(head,canvas);$('board').append(card);frames.push({frame,wrap,canvas});
 }
 renderComparison();renderPanel();renderFeedbackContext();renderSaved();
 requestAnimationFrame(resizeFrames);
}
function resizeFrames(){const width={mobile:390,tablet:768,desktop:1280}[current.viewport],preview=subject().preview||{},height=(current.context==='isolated'?preview.isolatedHeight:undefined)??preview.height??{mobile:844,tablet:1024,desktop:800}[current.viewport];for(const {frame,wrap,canvas} of frames){const scale=Math.max(.1,Math.min(1,(canvas.clientWidth-parseFloat(getComputedStyle(canvas).paddingLeft)-parseFloat(getComputedStyle(canvas).paddingRight))/width));frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';wrap.style.width=width*scale+'px';wrap.style.height=height*scale+'px';canvas.title='실제 화면 '+width+' × '+height+'px · '+Math.round(scale*100)+'% 축소 보기';}}
function notice(message){$('notice').textContent=message;}
async function get(url){const res=await fetch(url,{cache:'no-store'});const data=await res.json();if(!res.ok)throw new Error(data.error||'불러오지 못했어요.');return data;}
async function refresh(){if(refreshing){queuedRefresh=true;return;}refreshing=true;try{const next=await get('/api/manifest');manifest=next;render();notice('');}catch(e){notice('새 시안을 불러오지 못했어요. '+e.message);}finally{refreshing=false;if(queuedRefresh){queuedRefresh=false;refresh();}}}
async function updateStatus(){try{const data=await get('/api/status');saved={};for(const e of data.events)if(e.kind==='select')saved[e.subject]=e.variant;renderSaved();$('connection').dataset.active=String(data.active);$('connection').textContent=data.active?'에이전트가 의견을 확인하고 있어요':'의견 저장 가능 · 에이전트 연결 대기';$('history').replaceChildren();for(const e of data.events.slice(-6).reverse()){const s=manifest.subjects.find(x=>x.id===e.subject),v=s?.variants.find(x=>x.id===e.variant);$('history').append(node('p','',(e.kind==='select'?'선택':'의견')+' · '+(s?.name||e.subject)+' / '+(v?.name||e.variant)+(e.criterionLabel?' · '+e.criterionLabel:'')+(e.message?' — '+e.message:'')));}if(!data.events.length)$('history').append(node('p','','아직 선택하거나 남긴 의견이 없어요.'));if(data.acknowledged)$('history').append(node('p','','반영 기록 #'+data.acknowledged.seq+' · '+data.acknowledged.message));}catch{$('connection').textContent='미리보기 서버 연결이 끊겼어요';}}
async function post(kind,message,target=subject()){$('send').disabled=true;const own=target.id===current.subject,variant=own?current.variant:current.variantChoices[target.id];try{await getPost({kind,subject:target.id,variant,state:own||target.states.includes(current.state)?current.state:target.states[0],size:own||target.sizes.includes(current.size)?current.size:target.sizes[0],viewport:own?current.viewport:['mobile','tablet','desktop'].includes(current.viewportChoices[target.id])?current.viewportChoices[target.id]:target.preview?.viewport||'desktop',message,...(kind==='feedback'&&feedbackCriterion?{criterion:feedbackCriterion}:{})});$('feedback-status').textContent=kind==='select'?'선택을 저장했어요.':'수정 의견을 저장했어요.';if(kind==='select')saved[target.id]=variant;await updateStatus();}finally{$('send').disabled=false;}}
async function getPost(body){const res=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json','X-UI-Design':'review'},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw new Error(data.error||'저장하지 못했어요.');return data;}
$('feedback').onsubmit=async e=>{e.preventDefault();const message=$('message').value.trim();if(!message){$('feedback-status').textContent='수정 의견을 입력해 주세요.';$('message').focus();return;}try{await post('feedback',message);$('message').value='';feedbackCriterion=null;renderFeedbackContext();notice('');}catch(error){$('feedback-status').textContent=error.message;}};
function clean(value){for(const id of ['header','sidebar','catalog-details'])$(id).hidden=value;$('restore').hidden=!value;document.body.classList.toggle('clean',value);requestAnimationFrame(resizeFrames);}
$('hide').onclick=()=>clean(true);$('restore').onclick=()=>clean(false);
window.addEventListener('resize',resizeFrames);
window.addEventListener('message',e=>{if(!frames.some(f=>f.frame.contentWindow===e.source)||!e.data||typeof e.data!=='object')return;if(e.data.type==='ui-design:navigate'&&(subject().next||[]).includes(e.data.subject))setSubject(e.data.subject);if(e.data.type==='ui-design:back'&&historyStack.length)setSubject(historyStack.pop(),false);});
window.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.target.closest('button')||/INPUT|TEXTAREA/.test(e.target.tagName)||e.target.isContentEditable)return;if(['ArrowLeft','ArrowRight'].includes(e.key)&&manifest){const vs=subject().variants,i=vs.findIndex(v=>v.id===current.variant);choose('variant',vs[(i+(e.key==='ArrowRight'?1:-1)+vs.length)%vs.length].id,!!e.target.closest('#variant'));e.preventDefault();}});
function linkable(){const count={};for(const x of manifest.subjects)for(const v of x.variants)count[v.id]=(count[v.id]||0)+1;return Object.values(count).some(n=>n>1);}
function renderSaved(){
 if(!manifest)return;const s=subject(),v=s.variants.find(x=>x.id===saved[s.id]);
 $('selection-status').textContent=v?'저장한 방향 · '+v.name:'';
 for(const b of $('subject').children){const x=manifest.subjects.find(y=>y.id===b.dataset.value),sv=x?.variants.find(y=>y.id===saved[x.id]);b.textContent=x.name+(sv?' ✓':'');b.title=sv?x.name+' · 저장한 방향: '+sv.name:x.name+' · 아직 선택하지 않았어요';b.setAttribute('aria-label',b.title);}
}
function renderPanel(){
 const comparison=current.panel==='comparison';
 $('comparison').hidden=!comparison;$('board').hidden=comparison;
 document.querySelector('.preview-controls').hidden=comparison;
 $('panel-preview').setAttribute('aria-pressed',String(!comparison));
 $('panel-comparison').setAttribute('aria-pressed',String(comparison));
}
function switchPanel(panel){current.panel=panel;persist();renderPanel();requestAnimationFrame(resizeFrames);}
$('panel-preview').onclick=()=>switchPanel('preview');
$('panel-comparison').onclick=()=>switchPanel('comparison');
function inspectVariant(id){setVariant(id);current.panel='preview';render();$('panel-preview').focus();}
function renderFeedbackContext(){
 const criterion=subject().comparison?.criteria.find(c=>c.id===feedbackCriterion);
 if(!criterion)feedbackCriterion=null;
 const box=$('feedback-context');box.replaceChildren();box.hidden=!criterion;
 if(criterion){box.append(node('span','',selected().name+' · '+criterion.label));const clear=node('button','','대상 해제');clear.type='button';clear.onclick=()=>{feedbackCriterion=null;renderFeedbackContext();$('message').focus();};box.append(clear);}
}
function criterionFeedback(criterion,variant){
 feedbackCriterion=criterion;setVariant(variant);render();
 $('feedback-panel').open=true;$('message').focus();
}
function renderComparison(){
 const host=$('comparison'),s=subject(),c=s.comparison;host.replaceChildren();
 if(!c){const empty=node('div','empty-comparison');empty.append(node('h2','','아직 비교 내용이 없어요'),node('p','','시안별 차이와 추천이 준비되면 이곳에서 함께 볼 수 있어요.'));host.append(empty);return;}
 const intro=node('div','comparison-intro'),copy=node('div');copy.append(node('h2','','무엇이 다르고, 어떤 안이 맞을까요?'),node('p','','같은 조건의 시안을 기준별로 읽어보세요. 가설은 사용성 검증 결과가 아니에요.'));intro.append(copy);host.append(intro);
 const groups=[...new Set(c.criteria.map(x=>x.group).filter(Boolean))];
 if(current.criterionGroup&&!groups.includes(current.criterionGroup))current.criterionGroup='';
 const filters=node('div','matrix-filters');filters.setAttribute('role','group');filters.setAttribute('aria-label','비교 기준 필터');
 for(const group of ['',...groups]){const b=node('button','',group||'전체 기준');b.setAttribute('aria-pressed',String((current.criterionGroup||'')===group));b.onclick=()=>{current.criterionGroup=group;persist();renderComparison();[...host.querySelectorAll('.matrix-filters button')].find(x=>x.textContent===(group||'전체 기준'))?.focus();};filters.append(b);}
 const high=node('button','','중요 기준만');high.setAttribute('aria-pressed',String(!!current.highOnly));high.onclick=()=>{current.highOnly=!current.highOnly;persist();renderComparison();host.querySelector('.matrix-filters button:last-child').focus();};filters.append(high);host.append(filters);
 const scroll=node('div','matrix-scroll');scroll.tabIndex=0;scroll.setAttribute('role','region');scroll.setAttribute('aria-label','시안 비교표 · 가로로 스크롤할 수 있어요');
 const table=node('table','matrix');table.append(node('caption','',s.name+' · 기준별 차이와 근거'));
 const thead=node('thead'),header=node('tr'),corner=node('th','','비교 기준');corner.scope='col';header.append(corner);
 for(const v of s.variants){const th=node('th',v.id===current.variant?'active-column':'');th.scope='col';th.append(node('div','',v.name));const b=node('button','','화면 보기');b.setAttribute('aria-label',v.name+' 화면 보기');b.onclick=()=>inspectVariant(v.id);th.append(b);header.append(th);}thead.append(header);table.append(thead);
 const tbody=node('tbody');
 const criteria=c.criteria.filter(r=>(!current.criterionGroup||r.group===current.criterionGroup)&&(!current.highOnly||r.priority==='high'));
 for(const row of criteria){
  const tr=node('tr'),th=node('th');th.scope='row';th.append(node('div','',row.label+(row.priority==='high'?' · 중요':'')),node('p','criterion-why',row.why));tr.append(th);
  for(const v of s.variants){
   const cell=node('td',v.id===current.variant?'active-column':''),a=c.assessments.find(x=>x.criterion===row.id&&x.variant===v.id);
   cell.append(node('span','evidence-state',({observed:'시안·자료 관찰',hypothesis:'검증할 가설',untested:'미확인'}[a?.status]||'미확인')));
   cell.append(node('p','',a?.observation||'아직 이 기준으로 확인하지 않았어요.'));
   if(a){const details=node('details');details.append(node('summary','','근거·고려할 점'),node('p','','근거: '+a.evidence),node('p','','고려할 점: '+a.tradeoff));if(a.sourceUrl){const link=node('a','','참고 자료 열기');link.href=a.sourceUrl;link.target='_blank';link.rel='noopener noreferrer';details.append(link);}cell.append(details);}
   const feedback=node('button','','이 기준에 의견');feedback.setAttribute('aria-label',v.name+' · '+row.label+' 의견 남기기');feedback.onclick=()=>criterionFeedback(row.id,v.id);cell.append(feedback);tr.append(cell);
  }tbody.append(tr);
 }
 if(!criteria.length){const tr=node('tr'),td=node('td','','해당하는 기준이 없어요. 필터를 바꿔주세요.');td.colSpan=s.variants.length+1;tr.append(td);tbody.append(tr);}
 table.append(tbody);scroll.append(table);host.append(scroll);
 if(c.recommendations.length){host.append(node('h2','','상황에 맞는 추천'));const cards=node('div','recommendations');for(const r of c.recommendations){const card=node('article','recommendation');card.append(node('h3','',r.label),node('p','',r.reason));if(r.caution)card.append(node('p','','고려할 점: '+r.caution));for(const id of r.variants){const v=s.variants.find(x=>x.id===id),b=node('button','',v.name+' 확인');b.onclick=()=>inspectVariant(id);card.append(b);}cards.append(card);}host.append(cards);}
 if(c.nextComparison)host.append(node('p','comparison-next','다음으로 함께 볼 것 · '+c.nextComparison));
}
async function start(){try{[manifest,catalog]=await Promise.all([get('/api/manifest'),get('/api/catalog')]);storageKey='ui-design:'+location.origin+':'+manifest.title;try{current=JSON.parse(localStorage.getItem(storageKey)||'{}');}catch{current={};}if(!current||typeof current!=='object'||Array.isArray(current))current={};if(!current.variantChoices&&current.subject&&current.variant)current.variantChoices={[current.subject]:current.variant};const query=new URL(location.href).searchParams;if(query.get('subject'))current.subject=query.get('subject');if(query.get('variant')){current.variantChoices={...(current.variantChoices||{}),[current.subject||manifest.subjects[0].id]:query.get('variant')};}render();$('catalog-list').append(node('p','','아래 구성은 참고 아이디어예요. 목적에 따라 새로 만들거나 자유롭게 결합할 수 있어요.'));for(const family of ['service','landing','dashboard','chat']){const line=node('p');line.append(node('strong','',({service:'서비스',landing:'랜딩',dashboard:'대시보드',chat:'채팅'}[family])+': '));line.append(document.createTextNode(catalog.filter(t=>t.family===family).map(t=>t.name).join(' · ')));$('catalog-list').append(line);}const stream=new EventSource('/api/stream');stream.addEventListener('update',()=>{refresh();updateStatus();});stream.addEventListener('status',updateStatus);stream.onopen=()=>{refresh();updateStatus();};stream.onerror=()=>notice('실시간 연결을 복구하고 있어요. 의견이 저장됐는지 확인해 주세요.');await updateStatus();statusTimer=setInterval(updateStatus,15000);}catch(e){notice(e.message+' 서버의 manifest.json과 HTML 파일을 확인해 주세요.');}}
start();
</script>
