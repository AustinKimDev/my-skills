interface:
  display_name: "UI Design"
  short_description: "화면 설계부터 이미지 에셋 제작·적용·검증까지 조율하는 디자인 워크플로"
  default_prompt: "Use $ui-design with the bundled IKY guidance as the default foundation beneath explicit user direction and established project settings. Apple and service references are optional support. Choose review, guided exploration, or direct implementation from context. Design from the user task; screen catalogs and modes are extensible inspiration, never a closed menu. For exploration, ask focused questions, reuse bundled service analysis and local captures before any targeted web research, present five distinct variants (at least four), publish criterion-level comparisons and recommendations in the browser, and recommend both an overall direction and detailed refinements. Continue through answers, scoped previews, revision archives, and implementation. When the implementation needs imagery, use the bundled image-assets guide to design text and imagery together, generate and process the required assets, integrate repository files, and verify actual placements. Keep optional screen-concept generation separate from required asset production."
