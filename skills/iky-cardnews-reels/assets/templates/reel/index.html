<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reel preview</title>
<style>@font-face{font-family:P;src:local('Pretendard Medium'),local('Pretendard-Medium'),url(fonts/Pretendard-Medium.otf);font-weight:500}@font-face{font-family:P;src:local('Pretendard SemiBold'),local('Pretendard-SemiBold'),url(fonts/Pretendard-SemiBold.otf);font-weight:600}@font-face{font-family:P;src:local('Pretendard Bold'),local('Pretendard-Bold'),url(fonts/Pretendard-Bold.otf);font-weight:700}
/* Title face (D): loaded from fonts installed on this machine, never copied into a repository. */
@font-face{font-family:D;src:local('GmarketSansMedium'),local('Gmarket Sans Medium');font-weight:500}@font-face{font-family:D;src:local('GmarketSansBold'),local('Gmarket Sans Bold');font-weight:700}
html,body{margin:0;background:#0b0a0e;color:#f4f1f3;font-family:P,system-ui;color-scheme:dark}body{display:grid;place-items:center;min-height:100vh;gap:12px}canvas{height:calc(100vh - 80px);aspect-ratio:9/16;max-width:100vw;background:#121116}.bar{display:flex;gap:12px;align-items:center;width:min(560px,92vw)}input{flex:1;accent-color:#e8a2bd}button{background:#e8a2bd;color:#171218;border:0;border-radius:8px;padding:8px 14px;font:600 14px P}span{font-variant-numeric:tabular-nums;color:#aaa5ad;font-size:13px;min-width:70px}</style>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="bar"><button id="play">일시정지</button><input id="seek" type="range" min="0" max="1" step="0.0333" value="0" aria-label="재생 위치"><span id="time">0.0s</span></div>
<script src="timeline.js"></script>
<script src="render.js"></script>
<script>
const c = document.getElementById('c'), seek = document.getElementById('seek'), time = document.getElementById('time'), btn = document.getElementById('play');
const q = new URLSearchParams(location.search);
let playing = !q.has('t'), t = Number(q.get('t') || 0), last = null;
seek.max = motion.DURATION;
if (!playing) btn.textContent = '재생';
window.renderAt = s => { motion.draw(c, s); return true; };
window.motionReady = motion.ready.then(() => { render(); requestAnimationFrame(loop); return true; });
function render() { motion.draw(c, t); seek.value = t; time.textContent = t.toFixed(1) + 's'; }
function loop(now) { if (playing && last != null) { t = (t + (now - last) / 1000) % motion.DURATION; render(); } last = now; requestAnimationFrame(loop); }
btn.onclick = () => { playing = !playing; btn.textContent = playing ? '일시정지' : '재생'; };
seek.oninput = () => { t = Number(seek.value); render(); };
</script></html>
