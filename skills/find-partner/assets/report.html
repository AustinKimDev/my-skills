<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>
:root{color-scheme:light dark;--bg:#f7f8fc;--panel:#fff;--ink:#242638;--muted:#62687b;--line:#dfe3ed;--accent:#5349b7;--tint:#efedff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}header,main,footer{max-width:1300px;margin:auto;padding:28px}header{padding-top:44px}h1{font-size:clamp(28px,4vw,40px);letter-spacing:-1px;margin:12px 0}h2{font-size:23px;margin:0}h3{font-size:15px;margin:0 0 10px}p{margin:8px 0}a{color:var(--accent);text-underline-offset:4px}.muted,small,dt{color:var(--muted)}.brief{max-width:800px}.notes{padding:16px 20px;border-radius:12px;background:var(--tint);margin-top:20px}.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}label{font-size:13px;font-weight:600}input,select,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:10px 12px;min-height:44px}input,select{width:100%;margin-top:5px}button{cursor:pointer}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.list-head{display:flex;justify-content:space-between;align-items:center;margin:20px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}article{padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0}article[hidden]{display:none}.top{display:flex;justify-content:space-between;gap:16px}.audience{white-space:nowrap;font-size:14px}.top .muted{font-size:12px;overflow-wrap:anywhere}.tags{display:flex;gap:6px;margin:14px 0}.tags span{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 8px;background:var(--tint)}dl{margin:16px 0}dt{font-size:12px;font-weight:600;margin-top:10px}dd{margin:3px 0;font-size:14px;overflow-wrap:anywhere}.content{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}.content h3 small{font-weight:400}.photos{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity}figure{flex:0 0 145px;scroll-snap-align:start;margin:0;overflow:hidden;border:1px solid var(--line);border-radius:10px}figure img,.no-photo{width:100%;height:180px;object-fit:contain;display:block;background:#141622}.no-photo{display:grid;place-items:center;color:#c5c8d6}figcaption{padding:10px;font-size:12px}figcaption strong,figcaption a,figcaption span{display:block}figcaption p{color:var(--muted);font-size:11px;overflow-wrap:anywhere}.sources{border-top:1px solid var(--line);margin-top:16px;padding-top:12px;font-size:13px}#empty{padding:40px;text-align:center;color:var(--muted)}footer{font-size:12px;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#151723;--panel:#1d2030;--ink:#eff0f7;--muted:#a6acc2;--line:#35394e;--accent:#c0b8ff;--tint:#2c2945}}@media(max-width:850px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr 1fr}.toolbar label:first-child{grid-column:1/-1}header,main,footer{padding:20px}article{padding:20px}}@media print{.toolbar,button{display:none}.grid{display:block}article{break-inside:avoid;margin-bottom:20px}.photos{overflow:visible;flex-wrap:wrap}body{background:white;color:black}}
</style></head><body><header><small>파트너 후보 조사 · @@DATE@@</small><h1>@@TITLE@@</h1><p class="brief">@@BRIEF@@</p><div class="notes">@@NOTES@@</div></header><main><div class="toolbar"><label>후보 검색<input id="q" type="search" placeholder="이름, 계정, 활동 내용"></label><label>검토 순서<select id="priority"><option value="">전체</option>@@PRIORITIES@@</select></label><label>활동 분야<select id="category"><option value="">전체</option>@@CATEGORIES@@</select></label><label>연락 방식<select id="contact"><option value="">전체</option>@@METHODS@@</select></label></div><div class="list-head"><div><h2>모집 후보 목록</h2><span id="count" role="status" aria-live="polite">전체 @@TOTAL@@명</span></div><button id="print">인쇄 / PDF 저장</button></div><div class="grid">@@CARDS@@</div><p id="empty" hidden>조건에 맞는 후보가 없습니다. 검색어나 필터를 바꿔 보세요.</p></main><footer>조사일 @@DATE@@ · 사실과 모집 적합성 판단은 구분해 표시했습니다. 게시물 사진과 콘텐츠의 출처는 각 후보 카드에서 확인할 수 있습니다.</footer><script>
const cards=Array.from(document.querySelectorAll('article'));
const controls=['q','priority','category','contact'].map(id=>document.getElementById(id));
function filter(){const[q,p,k,m]=controls.map(x=>x.value.trim());let visible=0;for(const card of cards){const show=(!q||card.dataset.search.toLowerCase().includes(q.toLowerCase()))&&(!p||card.dataset.priority===p)&&(!k||card.dataset.category===k)&&(!m||JSON.parse(card.dataset.methods).includes(m));card.hidden=!show;if(show)visible++;}document.getElementById('count').textContent=`전체 ${cards.length}명 중 ${visible}명 표시`;document.getElementById('empty').hidden=visible>0;}
controls.forEach(x=>x.addEventListener(x.id==='q'?'input':'change',filter));document.getElementById('print').addEventListener('click',()=>window.print());filter();
</script></body></html>
