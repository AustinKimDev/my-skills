<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동네 클래스 · 비교 예제</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#20342d;background:#fff;font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,input{font:inherit}button{cursor:pointer;min-height:44px}button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #a64d24;outline-offset:3px}button:disabled{cursor:default;opacity:.55}header{display:flex;justify-content:space-between;padding:20px 6%;border-bottom:1px solid #e4e8e3;font-size:13px}main{max-width:1120px;margin:auto;padding:42px 6%}h1{font-size:40px;line-height:1.22;letter-spacing:-1.5px;margin:12px 0 18px;word-break:keep-all}h2{font-size:22px;line-height:1.4;margin:0 0 14px}h3{font-size:18px;margin:0 0 8px}p{margin:0 0 18px}.muted,small{color:#66746a}.eyebrow{font-size:13px;color:#457058;font-weight:650}.button{border:0;border-radius:10px;padding:13px 23px;background:#215e43;color:#fff;font-weight:700}.secondary{background:white;color:#215e43;border:1px solid #b8c7bc}article,.panel{padding:24px;border:1px solid #dde4de;border-radius:14px;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.split{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(230px,1fr);gap:32px;align-items:start}.stack{display:grid;gap:14px}.tag{font-size:12px;display:inline-block;background:#edf3ec;color:#41614d;border-radius:5px;padding:4px 8px;margin-bottom:12px}.price{font-variant-numeric:tabular-nums;font-weight:750;font-size:22px}.visual{height:160px;border-radius:9px;background:#e4edde;display:grid;place-items:center;margin-bottom:20px}.visual svg{width:88px;height:88px}.meta{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin:22px 0;color:#586d5e}.section{margin-top:34px}.list article{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:0;border-top:1px solid #dde4de;border-radius:0;padding:24px 0}.list .visual{display:none}.compact h1{font-size:30px}.editorial{font-family:"AppleMyungjo","Batang",serif;line-height:1.9}.editorial h1{font-size:48px;font-weight:500;letter-spacing:-1px}.editorial h2{font-size:27px;font-weight:500}.editorial .button{font-family:-apple-system,BlinkMacSystemFont,sans-serif}.utility{font-size:14px;line-height:1.55}.utility h1{font-size:30px;letter-spacing:-.7px}.utility h2{font-size:19px}.utility .price,.utility time{font-family:ui-monospace,monospace}.error{color:#ad3028;font-size:14px;margin:12px 0}.wire{filter:grayscale(1)}.wire article,.wire .panel,.wire .visual{border:1px dashed #859187;border-radius:0;background:#f4f5f3}.wire .button{background:#e5e7e4;color:#26352b;border:1px solid #87958b;border-radius:0}.wire .tag{background:none;padding:0}.isolate{min-height:100vh;display:grid;place-items:center;padding:32px}.specimen{width:min(100%,400px)}.specimen .button{width:100%}.button small{color:inherit;font-size:12px;display:block;font-weight:400;opacity:.9}.button.inline{display:flex;align-items:center;justify-content:space-between;gap:30px}.button.quiet{color:#215e43;background:#eef4ed;border:1px solid #a8bbaa}.size-sm .button{padding:9px 14px;font-size:14px}.size-lg .button{padding:18px 28px;font-size:18px}.sample-row{padding:20px 0;border-top:1px solid #dde4de}.sample-row label{display:block;font-size:13px;margin-bottom:8px}input{width:100%;padding:12px;border:1px solid #bec9bf;border-radius:8px}a{color:#215e43}.callout{padding:18px 22px;background:#f0f5ed;border-radius:12px;margin:22px 0}footer{font-size:12px;color:#69766b;padding:24px 6%}.success{text-align:center;padding:60px 20px}.success-mark{width:56px;height:56px;background:#e5f1e6;color:#215e43;border-radius:50%;font-size:30px;display:grid;place-items:center;margin:0 auto 24px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:650px){main{padding:28px 22px}.grid,.split{grid-template-columns:1fr}h1{font-size:31px}.editorial h1{font-size:36px}.list article{grid-template-columns:1fr}.meta{gap:8px 18px}.visual{height:130px}}
.weight-led h1{font-size:34px;font-weight:850;letter-spacing:-.8px}.weight-led h2{font-size:22px;font-weight:800}.weight-led .eyebrow{font-weight:800}.reading{line-height:1.95}.reading h1{font-size:40px;font-weight:500;letter-spacing:-.8px;line-height:1.35}.reading h2{font-size:23px;font-weight:550}.reading .sample-row{padding:28px 0}.category-list article{display:grid;grid-template-columns:140px 1fr auto;gap:20px;align-items:center}.category-list .visual{height:110px;margin:0}.featured{grid-template-columns:1.4fr 1fr}.featured article:first-child{grid-row:span 2}.featured article:first-child .visual{height:280px}.featured article:not(:first-child) .visual{display:none}.wide-hero>.visual{height:300px}.facts-bar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:24px 0;border-block:1px solid #dde4de;margin:24px 0}.price-action{display:flex;align-items:center;gap:20px}.price-action .price{white-space:nowrap}.price-action .button{flex:1;width:auto}.button.arrow{display:flex;justify-content:space-between;align-items:center;gap:24px;background:#fff;color:#215e43;border:2px solid #215e43}.button:active:not(:disabled){filter:brightness(.93)}@media(max-width:650px){.category-list article{grid-template-columns:1fr}.featured{grid-template-columns:1fr}.featured article:first-child{grid-row:auto}.featured article:first-child .visual{height:160px}.reading h1,.weight-led h1{font-size:30px}.wide-hero>.visual{height:180px}}
</style>
<div id="app"></div>
<script>
const params=new URLSearchParams(location.search),kind=params.get('kind')||'page',variant=params.get('variant')||'a',state=params.get('state')||'default',size=params.get('size')||'md',context=params.get('context')==='yes';
document.body.className='size-'+(['sm','md','lg'].includes(size)?size:'md')+(kind==='wireframe'?' wire':'')+(kind==='typography'?(variant==='b'?' editorial':variant==='c'?' utility':variant==='d'?' weight-led':variant==='e'?' reading':''):'');
const art='<div class="visual" aria-label="도자기 그릇 일러스트"><svg viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M17 40h66c-2 30-13 43-33 43S19 70 17 40Z" fill="#b5c9a7" stroke="#68865b" stroke-width="2"/><ellipse cx="50" cy="40" rx="33" ry="10" fill="#eff3e9" stroke="#68865b" stroke-width="2"/><path d="M39 14c-10 10 8 9 0 17m15-20c-10 10 8 9 0 17m15-14c-10 10 8 9 0 17" stroke="#68865b" stroke-width="2" stroke-linecap="round"/></svg></div>';
const heading='<span class="eyebrow">도예 · 연남동</span><h1>손끝으로 만드는<br>나의 첫 그릇</h1><p class="muted">흙을 만지고, 모양을 고르는 느긋한 두 시간.<br>처음이어도 나만의 그릇을 완성할 수 있어요.</p>';
const meta='<div class="meta"><span>9월 12일 토요일</span><span>오후 2:00 · 120분</span><span>최대 6명</span></div>';
function button(){const buttonVariant=kind==='typography'||(kind!=='component'&&['d','e'].includes(variant))?'a':variant;const blocked=['loading','disabled'].includes(state),label=state==='loading'?'예약 확인 중…':state==='disabled'?'예약이 마감됐어요':'예약하기';const action='<button class="button '+(buttonVariant==='b'?'inline':buttonVariant==='c'?'quiet':buttonVariant==='e'?'arrow':'')+'" '+(blocked?'disabled':'')+' data-next="prototype-detail">'+(buttonVariant==='b'?'<span>45,000원</span><span>'+label+' →</span>':buttonVariant==='e'?'<span>'+label+'</span><span aria-hidden="true">→</span>':label+(buttonVariant==='c'?'<small>무료 취소 · 수업 3일 전까지</small>':''))+'</button>';return (buttonVariant==='d'?'<div class="price-action"><span class="price">45,000원</span>'+action+'</div>':action)+(state==='error'?'<p class="error" role="alert">예약을 확인하지 못했어요. 잠시 후 다시 시도해 주세요.</p>':'');}
function card(name,category,price){return '<article>'+art+'<div><span class="tag">'+category+'</span><h3>'+name+'</h3><p class="muted">9월 12일 · 연남동 · 2시간</p><span class="price">'+price+'원</span></div><button class="button secondary" '+(kind==='prototype-home'&&!name.includes('첫 그릇')?'disabled':'data-next="prototype-detail"')+'>'+(kind==='prototype-home'&&!name.includes('첫 그릇')?'소개 예시':'클래스 보기')+'</button></article>';}
const cardItems=[card('손끝으로 만드는 나의 첫 그릇','도예 · 입문','45,000'),card('작은 꽃다발, 나에게 주는 선물','플라워 · 입문','38,000'),card('처음 굽는 버터 스콘','베이킹 · 입문','52,000')];
const cards=cardItems.join('');
const details='<section><h2>이런 시간을 보내요</h2><p>흙의 감촉을 익힌 뒤 작은 접시와 밥그릇 중 하나를 골라요. 손으로 모양을 잡고, 좋아하는 색으로 마무리해요.</p><h2 class="section">처음이어도 괜찮아요</h2><p>재료와 도구는 모두 준비되어 있어요. 편한 옷으로 오세요. 구운 작품은 3주 뒤 찾아갈 수 있어요.</p></section>';
let content='';
if(kind==='component')content=context?'<main><div class="split"><section>'+heading+meta+'</section><aside class="panel"><h2>함께 만들어요</h2><p class="muted">남은 자리 3개 · 재료비 포함</p>'+button()+'</aside></div></main>':'<div class="isolate"><div class="specimen">'+button()+'</div></div>';
else if(kind==='typography')content='<main>'+heading+meta+'<div class="sample-row"><label>가격 · 숫자 구분 · 보조 정보</label><span class="price">45,000원</span> <small>1인 · 재료비 포함</small></div><div class="sample-row">'+details+'</div><div class="sample-row"><label for="name">예약자 이름</label><input id="name" placeholder="이름을 입력해 주세요"><p class="error">이름을 두 글자 이상 입력해 주세요.</p>'+button()+'</div></main>';
else if(kind==='layout'||kind==='wireframe'||kind==='prototype-home'){
 const intro='<span class="eyebrow">가까운 곳에서 새로운 취미</span><h1>이번 주말,<br>무엇을 만들어볼까요?</h1><p class="muted">한 번의 수업으로 시작하는 나만의 시간.</p>';
 content='<main>'+(variant==='b'?'<div class="split"><aside>'+intro+'<div class="callout">이번 주 추천<br><strong>처음이어도 편안한 클래스</strong></div></aside><div class="list">'+cards+'</div></div>':variant==='d'?intro+'<div class="stack category-list">'+cardItems.map((item,index)=>'<section><h2>'+['도예','플라워','베이킹'][index]+'</h2>'+item+'</section>').join('')+'</div>':intro+'<div class="'+(variant==='c'?'list':variant==='e'?'grid featured':'grid')+'">'+cards+'</div>')+'</main>';
}else if(kind==='prototype-detail')content='<main><button class="button secondary" data-back>← 클래스 목록</button><div class="section split"><section>'+heading+meta+details+'</section><aside class="panel"><h2>예약 내용</h2><p>9월 12일 · 오후 2:00<br>성인 1명 · 재료비 포함</p><p class="price">45,000원</p><button class="button" data-next="prototype-result">예약 확인하기</button><p class="muted section">실제 결제 없이 흐름만 확인해요.</p></aside></div></main>';
else if(kind==='prototype-result')content='<main class="success"><div class="success-mark" aria-hidden="true">✓</div><h1>예약 흐름을 확인했어요</h1><p>손끝으로 만드는 나의 첫 그릇<br>9월 12일 토요일 · 오후 2:00</p><p class="muted">비교용 예제이며 실제 예약은 생성되지 않았어요.</p><button class="button" data-next="prototype-home">클래스 더 보기</button></main>';
else content='<main>'+(variant==='d'?'<section class="wide-hero">'+art+heading+meta+'</section><div class="split">'+details+'<aside class="panel"><h2>예약 정보</h2><p class="price">45,000원</p>'+button()+'</aside></div>':variant==='e'?heading+'<div class="facts-bar"><div>'+meta+'<span class="price">45,000원</span></div>'+button()+'</div><div class="split">'+details+art+'</div>':variant==='b'?'<div class="split"><section>'+art+details+'</section><aside class="panel">'+heading+meta+'<p class="price">45,000원</p>'+button()+'</aside></div>':variant==='c'?'<div class="compact">'+heading+meta+'<div class="callout"><div class="split"><span>남은 자리 3개<br><strong class="price">45,000원</strong></span>'+button()+'</div></div>'+details+'</div>':heading+meta+'<div class="split"><section>'+art+details+'</section><aside class="panel"><h2>주말 두 시간, 나를 위해</h2><p class="price">45,000원</p>'+button()+'<p class="muted section">수업 3일 전까지 무료 취소</p></aside></div>')+'</main>';
document.getElementById('app').innerHTML=(kind==='component'&&!context?'':'<header><strong>동네 클래스</strong><span>비교 도구 예제 · 가상 서비스</span></header>')+content+(kind==='component'?'':'<footer>UI Design 비교 예제 · 모든 클래스와 예약 정보는 샘플입니다.</footer>');
document.addEventListener('click',e=>{const next=e.target.closest('[data-next]'),back=e.target.closest('[data-back]');if(next){if(kind.startsWith('prototype'))parent.postMessage({type:'ui-design:navigate',subject:next.dataset.next},'*');else{let note=document.querySelector('#interaction-note');if(!note){note=document.createElement('p');note.id='interaction-note';note.className='muted';note.setAttribute('role','status');next.after(note);}note.textContent='클릭 반응 확인 완료. 화면 이동은 프로토타입 모드에서 볼 수 있어요.';}}if(back)parent.postMessage({type:'ui-design:back'},'*');});
</script></html>
